<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GRANTLY - Scholarship Discovery and Management Platform | Find your fit. Follow through.</title>
    <meta
      name="description"
      content="GRANTLY is a unified scholarship discovery and management platform. Find relevant educational financial assistance, understand your eligibility in plain language, navigate each application step by step, and track deadlines and documents. Free, no account, your data stays in your browser."
    />
    <meta name="theme-color" content="#183b32" />
    <meta name="keywords" content="GRANTLY, scholarship, scholarship finder, scholarship management, financial aid, eligibility checker, application tracker, deadlines, documents, India, students" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GRANTLY",
        "description": "A unified scholarship discovery and management platform: eligibility checks with plain-language reasons, step-by-step application guidance, application tracking, document readiness and a deadline calendar.",
        "url": "https://grantly.vercel.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": ["en", "hi"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    </script>
    <link rel="canonical" href="https://grantly.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GRANTLY" />
    <meta property="og:title" content="GRANTLY - Find your fit. Follow through." />
    <meta
      property="og:description"
      content="Find scholarships you qualify for, understand why, and track every application."
    />
    <meta property="og:url" content="https://grantly.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GRANTLY - Find your fit. Follow through." />
    <meta
      name="twitter:description"
      content="Find scholarships you qualify for, understand why, and track every application."
    />

    <!-- Fonts are self-hosted. Preload only the two used above the fold on the landing page. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/dm-serif-display-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <noscript>GRANTLY needs JavaScript to run. Please enable it in your browser settings.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
